[package]
name = "s3-bucket-lister"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-config = { version = "1.1.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.8.0"
tokio = { version = "1", features = ["full"] }
lambda_runtime = "0.14"
serde_json = "1"